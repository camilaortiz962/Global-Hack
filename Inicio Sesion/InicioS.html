<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/inicioS.css">
    <title>Inicio de Sesión | Global Seguros</title>

</head>
<body>
    <script src="script/inicioS.js"></script>
<header class="header">
        <div class="header-contenedor">

            <a href="#inicio" class="logo-link">
                <img src="Imagenes/global logo.png" alt="Global Seguros" class="logo-img">
            </a>

            <nav class="menu">
                <a href="#inicio">Inicio</a>
                <a href="#beneficios">Beneficios</a>
                <a href="#testimonios">Testimonios</a>
                <a href="#footer">Contacto</a>
                <a href="#" class="btn-header abrir-formulario" data-tipo="Agenda tu cita">Registrarse</a>
            </nav>

        </div>
    </header>


<section class="inicio-sesion fondo-seccion bg-usuario" id="inicio-sesion">
     <div class="formulario">
            <h2>INICIO DE SESIÓN</h2>

            <form id="formulario">

                <div >
                    <label>NOMBRES Y APELLIDOS</label>
                    <input type="text" id="nombre" 
                    maxlength="40"
                    placeholder="Ingrese su nombre"
                    required>
                    <small id="errorNombre"></small>
                </div>

                <div >
                    <label>CORREO ELECTRÓNICO</label>
                    <input type="email" id="correo" 
                    maxlength="50" 
                    placeholder="Ingrese su correo electrónico" 
                    required>
                 <small id="errorCorreo"></small>
                </div>

                <div >
                    <label>CONTRASEÑA</label>
                    <input type="password" id="password" 
                    maxlength="20" 
                    placeholder="Ingrese su contraseña"
                    required>
                     <small id="errorPassword"></small>
                </div>

                <div >
                    <label>VERIFIQUE SU CONTRASEÑA</label>
                    <input type="password" id="verificarPassword" 
                    maxlength="20" 
                    placeholder="Verifique su contraseña" 
                    required>
                    <small id="mensajeVerificacion"></small>
                </div>

            </form>

            <button type="submit">CREAR CUENTA </button>
        </div>
 </section>

</body>
</html>
