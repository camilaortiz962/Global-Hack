<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Global Seguros</title>
    <link rel="stylesheet" href="styles/InicioS.css">
</head>

<body>

<header class="header">

        <div class="header-contenedor">

            <a href="index.html#inicio" class="logo-link">
                <img src="Imagenes/global logo.png" alt="Global Seguros" class="logo-img">
            </a>

            <nav class="menu">
                <a href="index.html#inicio">Inicio</a>
                <a href="index.html#inicio">Beneficios</a>
                <a href="index.html#inicio">Testimonios</a>
                <a href="#" class="abrir-formulario">Contacto</a>
                <a href="index.html#inicio" class="btn-header">Registrarse</a>
            </nav>

        </div>
    </header>

    <section class="inicio-sesion fondo-seccion bg-usuario" id="inicio-sesion">
        <div class="formulario">
            <h2>INICIO DE SESIÓN</h2>

            <form id="formulario">

                <div>
                    <label>NOMBRES Y APELLIDOS</label>
                    <input 
                        type="text" 
                        id="nombre"
                        maxlength="40"
                        placeholder="Ingrese su nombre"
                        required
                    >
                    <small id="errorNombre"></small>
                </div>

                <div>
                    <label>CORREO ELECTRÓNICO</label>
                    <input 
                        type="email" 
                        id="correo"
                        maxlength="50"
                        placeholder="Ingrese su correo electrónico"
                        required
                    >
                    <small id="errorCorreo"></small>
                </div>

                <div>
                    <label>CONTRASEÑA</label>
                    <input 
                        type="password" 
                        id="password"
                        maxlength="20"
                        placeholder="Ingrese su contraseña"
                        required
                    >
                    <small id="errorPassword"></small>
                </div>

                <div>
                    <label>VERIFIQUE SU CONTRASEÑA</label>
                    <input 
                        type="password" 
                        id="verificarPassword"
                        maxlength="20"
                        placeholder="Verifique su contraseña"
                        required
                    >
                    <small id="mensajeVerificacion"></small>
                </div>

                <button type="submit">CREAR CUENTA</button>

            </form>
        </div>
    </section>

    <section class="modal-contacto" id="formularioContacto">
        <div class="modal-contenido">

            <button class="cerrar-formulario" type="button">×</button>

            <div class="contacto-header">
                <h2>Contáctenos</h2>
                <p>
                    Si desea recibir más información o solicitar asesoría personalizada,
                    diligencie la siguiente información y nos pondremos en contacto con usted.
                </p>
            </div>

            <form class="formulario-contacto">

                <div class="form-grid">
                    <div class="campo">
                        <label>Nombres y apellidos <span>*</span></label>
                        <input type="text" placeholder="Escribe tus nombres y apellidos" required>
                    </div>

                    <div class="campo">
                        <label>Cédula</label>
                        <input type="text" placeholder="Escribe el número">
                    </div>

                    <div class="campo">
                        <label>Correo electrónico <span>*</span></label>
                        <input type="email" placeholder="Escribe tu correo electrónico" required>
                    </div>

                    <div class="campo">
                        <label>Número de teléfono</label>
                        <input type="tel" placeholder="Escribe tu número">
                    </div>

                    <div class="campo">
                        <label>Ciudad</label>
                        <select>
                            <option value="">Selecciona tu ciudad</option>
                            <option>Bogotá</option>
                            <option>Medellín</option>
                            <option>Cali</option>
                            <option>Barranquilla</option>
                            <option>Otra</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Tipo de consulta</label>
                        <select>
                            <option value="">Selecciona una opción</option>
                            <option>Agenda tu cita</option>
                            <option>Servicio al cliente</option>
                            <option>Mayor información</option>
                        </select>
                    </div>
                </div>

                <div class="campo campo-completo">
                    <label>Sugerencias y observaciones</label>
                    <textarea placeholder="Escribe tus sugerencias y/o tus observaciones"></textarea>
                </div>

                <div class="autorizacion">
                    <input type="checkbox" id="datos" required>
                    <label for="datos">Acepto el tratamiento de datos personales.</label>
                </div>

                <button type="submit" class="btn-formulario">Enviar</button>

            </form>

        </div>
    </section>

    <script src="InicioS.js"></script>

</body>
</html>
