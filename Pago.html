    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/pagos.css">
    <title>Confirmación | Global Seguros</title>

</head>
<body>
<header class="header">
        <div class="header-contenedor">

            <a href="#inicio" class="logo-link">
                <img src="Imagenes/global logo.png" alt="Global Seguros" class="logo-img">
            </a>

            <nav class="menu">
                <a href="#inicio">Inicio</a>
                <a href="#beneficios">Beneficios</a>
                <a href="#testimonios">Testimonios</a>
                <a href="#footer">Contacto</a>
                <a href="#" class="btn-header abrir-formulario" data-tipo="Agenda tu cita">Registrarse</a>
            </nav>

        </div>
    </header>

 
   <section class="hero fondo-seccion bg-pagos" id="pago">
            <div class="overlay"></div>

   <section class="seccion-formulario">

    <div class="pasos">

        <div class="paso activo" id="circulo1">1</div>

        <div class="linea"></div>

        <div class="paso" id="circulo2">2</div>

    </div>


    <div id="paso1" class="paso-contenido mostrar">

        <h2>Datos del Estudiante</h2>

        <div class="grupo">
            <label>Nombre Completo</label>
            <input type="text" id="nombre" maxlength="50">
            <small id="errorNombre"></small>
        </div>

        <div class="grupo">
            <label>Documento de Identidad</label>
            <input type="text" id="documento" maxlength="15">
            <small id="errorDocumento"></small>
        </div>

        <div class="grupo">
            <label>Correo Electrónico</label>
            <input type="email" id="correo">
            <small id="errorCorreo"></small>
        </div>

        <div class="grupo">
            <label>Teléfono</label>
            <input type="text" id="telefono" maxlength="10">
            <small id="errorTelefono"></small>
        </div>

        <button type="button" id="continuar">
            CONTINUAR
        </button>

    </div>

 <div id="paso2" class="paso-contenido">

    <h2>Pago Seguro Educativo</h2>

    <p class="subtitulo">
        Paso 2 de 2
    </p>

    <div class="resumen-seguro">
        <p><strong>Producto:</strong> Seguro Educativo Anual</p>
        <p><strong>Vigencia:</strong> 12 Meses</p>
        <div class="alerta">
            ⚠ Renovación anual requerida.
        </div>
        <div class="precio">
            $300.000 COP
        </div>
    
    <div class="metodos">

        <h3>Método de Pago</h3>

        <div class="metodo activo" data-metodo="tarjeta">💳</div>
        <div class="metodo" data-metodo="pse">🏦</div>
        <div class="metodo" data-metodo="nequi">📱</div>
        <div class="metodo" data-metodo="daviplata">📲</div>

    </div>
    <div id="tarjeta" class="panel-pago mostrar">

        <input type="text" id="numeroTarjeta" placeholder="Número de tarjeta" maxlength="16">
        <input type="text" id="titular" placeholder="Nombre del titular">
        <input type="text" id="fecha" placeholder="MM/AA" maxlength="5">
        <input type="text" id="cvv" placeholder="CVV" maxlength="4">

    </div>

    <div id="pse" class="panel-pago">

        <select>

            <option>Seleccione Banco</option>
            <option>Bancolombia</option>
            <option>Davivienda</option>
            <option>BBVA</option>

        </select>

    </div>

    <div id="nequi" class="panel-pago">

        <input type="text"
               placeholder="Número Nequi"
               maxlength="10">
    </div>
    <div id="daviplata" class="panel-pago">
        <input type="text"
               placeholder="Número Daviplata"
               maxlength="10">
    </div>
    <div class="confirmacion">

        <label>
            <input type="checkbox" id="acepto">
            Acepto las condiciones del seguro.
        </label>

    </div>
    <div class="acciones">

        <button type="button" id="volver">
            VOLVER
        </button>
        <button type="button" id="btnPagar">
            PAGAR $300.000 COP
        </button>
    </div>

</div>
</section>

 <script src="pagos.js"></script>

 <script src="scripts/pagos.js"></script>

</body>
